<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UpNext Chronometer</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      padding: 16px;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    
    .app-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1a73e8;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Timer Display Box */
    #display-container {
      width: 100%;
      text-align: center;
      padding: 18px 10px;
      background: #ffffff;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: all 0.3s ease;
    }
    #timer-display {
      font-size: 3.2rem;
      font-weight: 700;
      color: #202124;
      font-variant-numeric: tabular-nums;
    }

    #display-container.warning-5m {
      background: #fef7e0;
      border-color: #f9ab00;
    }
    #display-container.warning-5m #timer-display {
      color: #b06000;
    }

    #display-container.warning-1m {
      background: #fce8e6;
      border-color: #ea4335;
      animation: pulse 1s infinite alternate;
    }
    #display-container.warning-1m #timer-display {
      color: #c5221f;
    }

    @keyframes pulse {
      from { border-color: #ea4335; }
      to { border-color: #b31412; }
    }

    /* Alert Banners */
    .banner {
      display: none;
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      text-align: center;
      font-weight: 600;
      font-size: 0.85rem;
    }
    #banner-5m { background: #feefc3; color: #714b00; }
    #banner-1m { background: #f8d7da; color: #721c24; }

    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .input-group {
      display: flex;
      gap: 8px;
    }
    input[type="number"] {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }
    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      background: #1a73e8;
      color: white;
      transition: background 0.2s;
    }
    button:hover { background: #1557b0; }

    .preset-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .preset-btns button {
      background: #e8f0fe;
      color: #1a73e8;
    }
    .preset-btns button:hover { background: #d2e3fc; }

    .action-btns {
      display: flex;
      gap: 8px;
    }
    .btn-stop { background: #dc3545; }
    .btn-stop:hover { background: #bb2d3b; }
  </style>
</head>
<body>

  <div class="app-title">UpNext Chronometer</div>

  <div id="display-container">
    <div id="timer-display">10:00</div>
  </div>

  <div id="banner-5m" class="banner">⚠️ 5 Minutes Remaining!</div>
  <div id="banner-1m" class="banner">🚨 1 Minute Remaining!</div>

  <div class="controls">
    <div class="input-group">
      <input type="number" id="minutes-input" min="1" max="180" placeholder="Custom Minutes">
      <button onclick="setCustomTime()">Set</button>
    </div>

    <div class="preset-btns">
      <button onclick="setPreset(10)">10 Min</button>
      <button onclick="setPreset(20)">20 Min</button>
      <button onclick="setPreset(30)">30 Min</button>
    </div>

    <div class="action-btns">
      <button style="flex:2;" id="start-btn" onclick="startTimer()">Start</button>
      <button class="btn-stop" style="flex:1;" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <script>
    let duration = 10 * 60; // Default 10 mins
    let initialDuration = 10 * 60;
    let timerInterval = null;
    let isRunning = false;
    
    let triggered5m = false;
    let triggered1m = false;

    const display = document.getElementById('timer-display');
    const container = document.getElementById('display-container');
    const banner5m = document.getElementById('banner-5m');
    const banner1m = document.getElementById('banner-1m');
    const startBtn = document.getElementById('start-btn');

    function updateDisplay() {
      const minutes = String(Math.floor(duration / 60)).padStart(2, '0');
      const seconds = String(duration % 60).padStart(2, '0');
      display.textContent = `${minutes}:${seconds}`;

      // 5-MIN ALERT (300 seconds)
      if (duration === 300 && !triggered5m) {
        triggered5m = true;
        container.className = 'warning-5m';
        banner5m.style.display = 'block';
        banner1m.style.display = 'none';
        playGongSound(); 
        triggerInSlideBanner("⚠️ 5 MINUTES REMAINING", "#F9AB00", "#FFFFFF");
      }

      // 1-MIN CRITICAL ALERT (60 seconds)
      if (duration === 60 && !triggered1m) {
        triggered1m = true;
        container.className = 'warning-1m';
        banner5m.style.display = 'none';
        banner1m.style.display = 'block';
        playGongSound(); 
        triggerInSlideBanner("🚨 1 MINUTE REMAINING!", "#EA4335", "#FFFFFF");
      }
    }

    // Injects a temporary big banner in the middle of the Google Slide presentation canvas
    function triggerInSlideBanner(messageText, bgHex, textHex) {
      if (window.google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(function(shapeId) {
          if (shapeId) {
            // Automatically delete the banner after 4 seconds (4000 ms)
            setTimeout(() => {
              google.script.run.removeSlideBanner(shapeId);
            }, 4000);
          }
        }).showSlideBanner(messageText, bgHex, textHex);
      }
    }

    // Deep Chinese Gong Audio Synthesis
    function playGongSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const frequencies = [130.81, 206.00, 311.13, 466.16, 622.25];
        
        frequencies.forEach((freq, index) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          
          osc.type = index === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(freq * 0.98, ctx.currentTime + 1.5);

          const volume = index === 0 ? 0.3 : 0.1 / index;
          gain.gain.setValueAtTime(volume, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3.5);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 3.5);
        });
      } catch (e) {
        console.log("Audio waiting for user interaction");
      }
    }

    function startTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.textContent = "Resume";
        return;
      }

      isRunning = true;
      startBtn.textContent = "Pause";
      timerInterval = setInterval(() => {
        if (duration > 0) {
          duration--;
          updateDisplay();
        } else {
          clearInterval(timerInterval);
          isRunning = false;
          display.textContent = "00:00";
          playGongSound();
          triggerInSlideBanner("⌛ TIME'S UP!", "#202124", "#FFFFFF");
        }
      }, 1000);
    }

    function setCustomTime() {
      const val = parseInt(document.getElementById('minutes-input').value);
      if (val && val > 0) {
        setPreset(val);
      }
    }

    function setPreset(mins) {
      clearInterval(timerInterval);
      isRunning = false;
      startBtn.textContent = "Start";
      duration = mins * 60;
      initialDuration = duration;
      clearAlertStates();
      updateDisplay();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      startBtn.textContent = "Start";
      duration = initialDuration;
      clearAlertStates();
      updateDisplay();
    }

    function clearAlertStates() {
      triggered5m = false;
      triggered1m = false;
      container.className = '';
      banner5m.style.display = 'none';
      banner1m.style.display = 'none';
    }

    updateDisplay();
  </script>
</body>
</html>
